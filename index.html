<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toon Bingo: Online</title>
    <!-- PeerJS for Online Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF8E1;
            --ink-color: #2c3e50;
            --btn-color: #FFB74D;
            --btn-shadow: #E65100;
            --p1-color: #FF6B6B;
            --p2-color: #4ECDC4;
            --marked-color: #FFE66D;
            --win-color: #00b894;
            --online-color: #6C5CE7;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d7ccc8 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
            color: var(--ink-color);
            user-select: none;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .screen.active { display: flex; }

        .card {
            background: white;
            border: 4px solid var(--ink-color);
            border-radius: 20px;
            box-shadow: 8px 8px 0px var(--ink-color);
            padding: 20px;
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        h1 { font-size: 3rem; margin: 0; text-transform: uppercase; color: var(--ink-color); text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        h2 { margin: 10px 0; }

        .cartoon-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 3px solid var(--ink-color);
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            box-shadow: 5px 5px 0px var(--ink-color);
            transition: transform 0.1s;
        }
        .cartoon-btn:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0px var(--ink-color); }
        .cartoon-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; }
        
        .btn-p1 { background: var(--p1-color); box-shadow: 5px 5px 0px #c0392b; }
        .btn-p2 { background: var(--p2-color); box-shadow: 5px 5px 0px #16a085; }
        .btn-online { background: var(--online-color); box-shadow: 5px 5px 0px #4834d4; }
        .btn-back { background: #95a5a6; box-shadow: 5px 5px 0px #7f8c8d; }
        .btn-share { background: #25D366; box-shadow: 5px 5px 0px #128C7E; }
        .btn-copy { background: #636e72; box-shadow: 5px 5px 0px #2d3436; }

        /* Lobby Styles */
        .room-id-box {
            background: #eee;
            padding: 15px;
            border: 2px dashed var(--ink-color);
            border-radius: 10px;
            font-family: monospace;
            font-size: 1.4rem;
            margin: 15px 0;
            word-break: break-all;
            font-weight: bold;
        }
        .input-group { display: flex; gap: 5px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border: 3px solid var(--ink-color); border-radius: 10px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; text-align: center; }

        /* Game Layout */
        .game-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .game-layout { flex-direction: row; align-items: flex-start; justify-content: center; }
            .board-container { flex: 1; max-width: 350px; }
            .controls-container { flex: 0 0 300px; order: 2; }
        }

        /* Bingo Board */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: var(--ink-color);
            border: 4px solid var(--ink-color);
            border-radius: 10px;
            padding: 5px;
            aspect-ratio: 1;
        }

        .cell {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: default;
            aspect-ratio: 1;
            transition: background 0.2s;
        }

        .cell.marked {
            background: var(--marked-color);
            color: var(--ink-color);
            position: relative;
        }
        
        .cell.marked::after {
            content: 'X';
            position: absolute;
            font-size: 2rem;
            color: rgba(0,0,0,0.2);
            font-weight: 900;
        }

        .cell.winning-cell {
            background: var(--win-color) !important;
            color: white;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Controls */
        .timer-box {
            font-size: 2rem;
            font-weight: bold;
            background: var(--ink-color);
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 3px solid white;
        }
        .timer-warning { background: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .num-btn {
            background: white;
            border: 2px solid var(--ink-color);
            border-radius: 8px;
            padding: 10px 0;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink-color);
        }
        .num-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--ink-color); }
        .num-btn.used {
            background: #ccc;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        /* Disable number pad if not my turn in online mode */
        .number-pad.disabled {
            pointer-events: none;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .history-log {
            background: #f0f0f0;
            border: 2px solid var(--ink-color);
            border-radius: 10px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.9rem;
        }
        .history-item {
            display: inline-block;
            background: white;
            border: 1px solid var(--ink-color);
            border-radius: 4px;
            padding: 2px 6px;
            margin: 2px;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            border: 4px solid var(--ink-color);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 10px 10px 0px var(--ink-color);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .warning-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            border: 3px solid var(--ink-color);
            font-weight: bold;
            z-index: 200;
            display: none;
            box-shadow: 5px 5px 0px var(--ink-color);
        }
        
        .connection-status {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <!-- WARNING TOAST -->
    <div id="warning-toast" class="warning-toast">⚠️ Number Already Chosen!</div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <div class="card">
            <h1>BINGO</h1>
            <p style="font-size: 1.2rem; margin-bottom: 20px;">Mark 5 in a row to win!</p>
            
            <button class="cartoon-btn btn-online" onclick="showLobby()">🌍 Play Online</button>
            <button class="cartoon-btn btn-p1" onclick="startGame('pvp')">2 Players (Local)</button>
            <button class="cartoon-btn btn-p2" onclick="startGame('ai')">vs Computer</button>
        </div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="card">
            <h2>Online Lobby</h2>
            
            <button class="cartoon-btn btn-online" id="btn-create" onclick="createRoom()">🏠 Create Room</button>
            <div id="create-result" style="display:none;">
                <p>Share this ID with your friend:</p>
                <div class="room-id-box" id="my-room-id">...</div>
                <div style="display:flex; gap:10px;">
                    <!-- SHARE BUTTON -->
                    <button class="cartoon-btn btn-share" style="flex:1" onclick="shareRoomId()">📤 Share</button>
                    <button class="cartoon-btn btn-copy" style="flex:1" onclick="copyRoomId()">📋 Copy</button>
                </div>
                <p class="connection-status" id="host-status">Waiting for player...</p>
            </div>

            <div style="margin: 20px 0; border-bottom: 2px dashed #ccc;"></div>

            <h3>Join Room</h3>
            <div class="input-group">
                <input type="text" id="join-id-input" placeholder="Paste Room ID">
                <button class="cartoon-btn btn-online" style="width:auto; margin:0;" onclick="joinRoom()">Join</button>
            </div>
            <p class="connection-status" id="join-status"></p>

            <button class="cartoon-btn btn-back" onclick="goHome()">Back</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="game-layout">
            
            <!-- Player 1 Board -->
            <div class="board-container">
                <div class="card">
                    <h2 id="p1-name">Player 1</h2>
                    <div class="bingo-grid" id="p1-grid"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-container card">
                <div class="timer-box" id="timer">60</div>
                <h3 id="turn-indicator">Waiting...</h3>
                <p id="online-status" style="font-size:0.8rem; color:#666;"></p>
                
                <div class="number-pad" id="number-pad">
                    <!-- Generated by JS -->
                </div>

                <h4>History</h4>
                <div class="history-log" id="history-log"></div>
                
                <button class="cartoon-btn btn-back" style="margin-top: 15px;" onclick="goHome()">Exit</button>
            </div>

            <!-- Player 2 Board -->
            <div class="board-container">
                <div class="card">
                    <h2 id="p2-name">Player 2</h2>
                    <div class="bingo-grid" id="p2-grid"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- WIN MODAL -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h1 style="color: var(--win-color); font-size: 4rem; margin: 0;">BINGO!</h1>
            <h2 id="winner-name">Player 1 Wins!</h2>
            <button class="cartoon-btn" onclick="goHome()">Play Again</button>
        </div>
    </div>

<script>
    // --- CONFIG ---
    const GRID_SIZE = 5;
    const TOTAL_NUMBERS = 25;
    const WIN_COUNT = 5;
    const TIME_LIMIT = 60;

    // --- STATE ---
    let p1Board = [];
    let p2Board = [];
    let p1Marks = [];
    let p2Marks = [];
    let chosenNumbers = [];
    let currentPlayer = 1; // 1 or 2
    let gameMode = 'pvp'; // 'pvp', 'ai', 'online'
    let timerInterval;
    let timeLeft = TIME_LIMIT;
    let isGameActive = false;
    let myPlayerId = 1; // In online mode: 1 = Host, 2 = Client

    // PeerJS Variables
    let peer = null;
    let conn = null;
    let myRoomId = null;

    // --- DOM ---
    const homeScreen = document.getElementById('home-screen');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const p1Grid = document.getElementById('p1-grid');
    const p2Grid = document.getElementById('p2-grid');
    const numberPad = document.getElementById('number-pad');
    const historyLog = document.getElementById('history-log');
    const timerEl = document.getElementById('timer');
    const turnIndicator = document.getElementById('turn-indicator');
    const winModal = document.getElementById('win-modal');
    const winnerNameEl = document.getElementById('winner-name');
    const warningToast = document.getElementById('warning-toast');
    const p1NameEl = document.getElementById('p1-name');
    const p2NameEl = document.getElementById('p2-name');
    const onlineStatusEl = document.getElementById('online-status');

    // --- INITIALIZATION ---
    function startGame(mode) {
        gameMode = mode;
        homeScreen.classList.remove('active');
        lobbyScreen.classList.remove('active');
        gameScreen.classList.add('active');
        
        if (mode === 'online') {
            onlineStatusEl.innerText = "🟢 Connected Online";
            onlineStatusEl.style.color = "green";
        } else {
            onlineStatusEl.innerText = "";
        }

        initBoards();
        initNumberPad();
        resetGame();
    }

    function goHome() {
        clearInterval(timerInterval);
        if (conn) conn.close();
        if (peer) peer.destroy();
        conn = null;
        peer = null;
        
        winModal.style.display = 'none';
        gameScreen.classList.remove('active');
        lobbyScreen.classList.remove('active');
        homeScreen.classList.add('active');
        isGameActive = false;
    }

    function initBoards() {
        // Each player gets a UNIQUE random board
        p1Board = generateRandomBoard();
        p2Board = generateRandomBoard();
        p1Marks = Array(25).fill(false);
        p2Marks = Array(25).fill(false);
        chosenNumbers = [];
        
        renderBoard(p1Grid, p1Board, p1Marks);
        renderBoard(p2Grid, p2Board, p2Marks);
    }

    function generateRandomBoard() {
        let nums = Array.from({length: TOTAL_NUMBERS}, (_, i) => i + 1);
        for (let i = nums.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [nums[i], nums[j]] = [nums[j], nums[i]];
        }
        return nums;
    }

    function initNumberPad() {
        numberPad.innerHTML = '';
        for (let i = 1; i <= TOTAL_NUMBERS; i++) {
            const btn = document.createElement('button');
            btn.classList.add('num-btn');
            btn.innerText = i;
            btn.onclick = () => handleNumberSelect(i);
            numberPad.appendChild(btn);
        }
    }

    function renderBoard(gridEl, boardData, marksData) {
        gridEl.innerHTML = '';
        boardData.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = num;
            cell.id = `cell-${gridEl.id}-${index}`;
            
            if (marksData[index]) {
                cell.classList.add('marked');
            }
            gridEl.appendChild(cell);
        });
    }

    function resetGame() {
        chosenNumbers = [];
        historyLog.innerHTML = '';
        updateNumberPadUI();
        currentPlayer = 1;
        timeLeft = TIME_LIMIT;
        isGameActive = true;
        updateTurnUI();
        startTimer();
    }

    // --- ONLINE LOGIC (PeerJS) ---
    function showLobby() {
        homeScreen.classList.remove('active');
        lobbyScreen.classList.add('active');
        document.getElementById('create-result').style.display = 'none';
        document.getElementById('join-status').innerText = '';
        document.getElementById('host-status').innerText = 'Waiting for player...';
        document.getElementById('join-id-input').value = '';
    }

    function createRoom() {
        const btn = document.getElementById('btn-create');
        btn.disabled = true;
        btn.innerText = "Creating...";

        peer = new Peer(null, { debug: 2 });

        peer.on('open', (id) => {
            myRoomId = id;
            myPlayerId = 1; // Host is Player 1
            document.getElementById('create-result').style.display = 'block';
            document.getElementById('my-room-id').innerText = id;
            btn.disabled = false;
            btn.innerText = "Create Room";
        });

        peer.on('connection', (c) => {
            conn = c;
            setupConnection();
            document.getElementById('host-status').innerText = "Player Connected! Starting...";
            document.getElementById('host-status').style.color = "green";
            setTimeout(() => {
                startGame('online');
            }, 1000);
        });
    }

    function joinRoom() {
        const id = document.getElementById('join-id-input').value.trim();
        const status = document.getElementById('join-status');
        
        if (!id) { status.innerText = "Enter ID"; return; }
        status.innerText = "Connecting...";

        peer = new Peer(null, { debug: 2 });

        peer.on('open', () => {
            conn = peer.connect(id);
            conn.on('open', () => {
                myPlayerId = 2; // Client is Player 2
                setupConnection();
                status.innerText = "Connected! Starting...";
                status.style.color = "green";
                setTimeout(() => {
                    startGame('online');
                }, 1000);
            });
            conn.on('error', () => {
                status.innerText = "Failed. Check ID.";
                status.style.color = "red";
            });
        });
    }

    function setupConnection() {
        conn.on('data', (data) => {
            handleNetworkData(data);
        });
        conn.on('close', () => {
            if(isGameActive) alert("Opponent disconnected!");
            goHome();
        });
    }

    function copyRoomId() {
        if (!myRoomId) return;
        navigator.clipboard.writeText(myRoomId).then(() => showToast("Copied!"));
    }

    // --- SHARE FUNCTIONALITY ---
    function shareRoomId() {
        if (!myRoomId) return;
        
        const text = `Join my Bingo game! 🎲\nRoom ID: ${myRoomId}\n\nOpen the game and paste this ID to join!`;
        
        // Check if the device supports native sharing (Mobile phones mostly)
        if (navigator.share) {
            navigator.share({
                title: 'Toon Bingo',
                text: text,
                url: window.location.href // Shares the link to the game too
            })
            .then(() => console.log('Successful share'))
            .catch((error) => console.log('Error sharing', error));
        } else {
            // Fallback for Desktop browsers that don't support share API
            copyRoomId();
            alert("Share not supported on this browser. Room ID copied to clipboard!");
        }
    }

    function handleNetworkData(data) {
        if (data.type === 'move') {
            processMove(data.number, false); // false = don't send back
        } else if (data.type === 'win') {
            endGame(data.winner, false); // false = don't send back
        } else if (data.type === 'restart') {
            resetGame();
        }
    }

    function sendMove(number) {
        if (conn && conn.open) {
            conn.send({ type: 'move', number: number });
        }
    }

    function sendWin(winner) {
        if (conn && conn.open) {
            conn.send({ type: 'win', winner: winner });
        }
    }

    // --- GAME LOGIC ---
    function startTimer() {
        clearInterval(timerInterval);
        timerEl.classList.remove('timer-warning');
        timerEl.innerText = timeLeft;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 10) timerEl.classList.add('timer-warning');

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showToast("Time's Up!");
                switchTurn();
            }
        }, 1000);
    }

    function handleNumberSelect(num) {
        if (!isGameActive) return;
        // In online mode, only allow clicks if it's my turn
        if (gameMode === 'online' && currentPlayer !== myPlayerId) return;
        if (gameMode === 'ai' && currentPlayer === 2) return;

        if (chosenNumbers.includes(num)) {
            showToast("⚠️ Number Already Chosen!");
            return;
        }

        processMove(num, true);
    }

    function processMove(num, isMyMove) {
        // Add to history
        chosenNumbers.push(num);
        addToHistory(num);
        updateNumberPadUI();

        // Mark on BOTH boards (Shared numbers, different boards)
        markBoard(1, num);
        markBoard(2, num);

        // Check Win
        if (checkWin(p1Marks)) {
            endGame(1, isMyMove);
            return;
        }
        if (checkWin(p2Marks)) {
            endGame(2, isMyMove);
            return;
        }

        switchTurn();
    }

    function markBoard(playerNum, num) {
        const board = playerNum === 1 ? p1Board : p2Board;
        const marks = playerNum === 1 ? p1Marks : p2Marks;
        const gridId = playerNum === 1 ? 'p1-grid' : 'p2-grid';

        const index = board.indexOf(num);
        if (index !== -1) {
            marks[index] = true;
            const cell = document.getElementById(`cell-${gridId}-${index}`);
            if(cell) cell.classList.add('marked');
        }
    }

    function checkWin(marks) {
        // Rows
        for (let r = 0; r < GRID_SIZE; r++) {
            let count = 0;
            for (let c = 0; c < GRID_SIZE; c++) {
                if (marks[r * GRID_SIZE + c]) count++;
            }
            if (count === WIN_COUNT) return true;
        }
        // Cols
        for (let c = 0; c < GRID_SIZE; c++) {
            let count = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (marks[r * GRID_SIZE + c]) count++;
            }
            if (count === WIN_COUNT) return true;
        }
        // Diagonals
        let d1 = 0, d2 = 0;
        for (let i = 0; i < GRID_SIZE; i++) {
            if (marks[i * GRID_SIZE + i]) d1++;
            if (marks[i * GRID_SIZE + (GRID_SIZE - 1 - i)]) d2++;
        }
        if (d1 === WIN_COUNT || d2 === WIN_COUNT) return true;

        return false;
    }

    function switchTurn() {
        currentPlayer = currentPlayer === 1 ? 2 : 1;
        
        if (gameMode === 'ai' && currentPlayer === 2) {
            updateTurnUI();
            setTimeout(aiMove, 1000);
        } else {
            updateTurnUI();
        }
    }

    function aiMove() {
        if (!isGameActive) return;
        let available = [];
        for (let i = 1; i <= TOTAL_NUMBERS; i++) {
            if (!chosenNumbers.includes(i)) available.push(i);
        }
        if (available.length > 0) {
            const randomNum = available[Math.floor(Math.random() * available.length)];
            processMove(randomNum, true);
        }
    }

    function updateTurnUI() {
        timeLeft = TIME_LIMIT;
        timerEl.innerText = timeLeft;
        timerEl.classList.remove('timer-warning');
        
        let isMyTurn = false;

        if (gameMode === 'online') {
            if (currentPlayer === myPlayerId) {
                turnIndicator.innerText = "Your Turn!";
                turnIndicator.style.color = "var(--win-color)";
                isMyTurn = true;
            } else {
                turnIndicator.innerText = "Opponent's Turn";
                turnIndicator.style.color = "#666";
                isMyTurn = false;
            }
        } else if (gameMode === 'ai') {
            if (currentPlayer === 1) {
                turnIndicator.innerText = "Your Turn";
                turnIndicator.style.color = "var(--p1-color)";
                isMyTurn = true;
            } else {
                turnIndicator.innerText = "Computer Thinking...";
                turnIndicator.style.color = "var(--p2-color)";
                isMyTurn = false;
            }
        } else {
            // Local PVP
            turnIndicator.innerText = currentPlayer === 1 ? "Player 1's Turn" : "Player 2's Turn";
            turnIndicator.style.color = currentPlayer === 1 ? "var(--p1-color)" : "var(--p2-color)";
            isMyTurn = true;
        }

        // Disable number pad if not my turn in online/AI mode
        if (!isMyTurn && (gameMode === 'online' || gameMode === 'ai')) {
            numberPad.classList.add('disabled');
        } else {
            numberPad.classList.remove('disabled');
        }

        startTimer();
    }

    function addToHistory(num) {
        const item = document.createElement('span');
        item.classList.add('history-item');
        item.innerText = num;
        historyLog.prepend(item);
    }

    function updateNumberPadUI() {
        const buttons = document.querySelectorAll('.num-btn');
        buttons.forEach(btn => {
            const num = parseInt(btn.innerText);
            if (chosenNumbers.includes(num)) {
                btn.classList.add('used');
            } else {
                btn.classList.remove('used');
            }
        });
    }

    function endGame(winner, isMyWin) {
        isGameActive = false;
        clearInterval(timerInterval);
        
        let name = "";
        if (gameMode === 'online') {
            name = winner === myPlayerId ? "You" : "Opponent";
            // If I won, tell opponent
            if (isMyWin) sendWin(winner);
        } else if (gameMode === 'ai') {
            name = winner === 1 ? "You" : "Computer";
        } else {
            name = winner === 1 ? "Player 1" : "Player 2";
        }

        winnerNameEl.innerText = `${name} Wins!`;
        winnerNameEl.style.color = winner === 1 ? "var(--p1-color)" : "var(--p2-color)";
        
        winModal.style.display = 'flex';
    }

    function showToast(msg) {
        warningToast.innerText = msg;
        warningToast.style.display = 'block';
        setTimeout(() => { warningToast.style.display = 'none'; }, 2000);
    }

</script>
</body>
</html>
