<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Duel - Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E0F7FA;
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #292F36;
            --white: #FFFFFF;
            --shadow: 0 6px 0 var(--dark);
            --shadow-active: 0 2px 0 var(--dark);
            --warning: #FF9F43;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        /* --- WELCOME SCREEN --- */
        .welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        .welcome-title {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--white);
            text-shadow: 4px 4px 0 var(--dark);
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        .welcome-subtitle {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 30px;
            font-weight: bold;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .menu-btn {
            background: var(--white);
            color: var(--dark);
            border: 4px solid var(--dark);
            padding: 15px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--dark);
            transition: all 0.1s;
        }

        .menu-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--dark);
        }

        .menu-btn.primary { background: var(--accent); }
        .menu-btn.secondary { background: var(--secondary); color: var(--white); }

        /* Room ID Panel */
        .room-panel {
            background: var(--white);
            padding: 20px;
            border-radius: 20px;
            border: 4px solid var(--dark);
            margin-top: 20px;
            display: none;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 300px;
        }

        .room-id-box {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: var(--primary);
            letter-spacing: 3px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 10px;
            border: 2px dashed var(--dark);
            margin: 10px 0;
            word-break: break-all;
        }

        .copy-feedback {
            color: var(--secondary);
            font-weight: bold;
            height: 20px;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        /* --- GAME SCREEN --- */
        .game-container {
            display: none;
            background: var(--white);
            padding: 15px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 4px solid var(--dark);
            width: 95%;
            max-width: 450px;
            text-align: center;
            margin: 10px;
            position: relative;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: var(--dark);
            padding: 8px;
            border-radius: 15px;
            color: var(--white);
        }

        .room-display-small {
            font-family: 'Fredoka One';
            font-size: 0.9rem;
            color: var(--accent);
        }

        .timer-box {
            background: var(--white);
            color: var(--dark);
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Fredoka One';
        }

        .timer-val { color: var(--primary); }

        /* Warning Message */
        .warning-box {
            background: var(--warning);
            color: var(--dark);
            padding: 10px;
            border-radius: 12px;
            border: 3px solid var(--dark);
            margin-bottom: 10px;
            font-weight: bold;
            font-family: 'Fredoka One';
            display: none;
            animation: shake 0.5s;
        }

        .warning-box.show {
            display: block;
        }

        /* 5x5 Grid */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 15px 0;
            background: var(--dark);
            padding: 6px;
            border-radius: 15px;
            border: 3px solid var(--dark);
        }

        .cell {
            aspect-ratio: 1;
            background: var(--secondary);
            border: 2px solid var(--dark);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--white);
            cursor: default;
            position: relative;
            transition: all 0.2s;
        }

        .cell.marked {
            background: var(--primary);
            animation: popMark 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell.marked::after {
            content: '★';
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255,255,255,0.5);
        }

        .cell.winning-cell {
            background: var(--accent);
            color: var(--dark);
            animation: pulseWin 1s infinite;
        }
        .cell.winning-cell::after { content: ''; }

        /* History List */
        .history-panel {
            background: var(--bg-color);
            border: 3px solid var(--dark);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 80px;
            overflow-y: auto;
            text-align: left;
        }

        .history-title {
            font-family: 'Fredoka One';
            color: var(--dark);
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .history-item {
            background: var(--white);
            border: 2px solid var(--dark);
            border-radius: 8px;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: default;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 3px solid var(--dark);
            border-radius: 12px;
            font-family: 'Fredoka One';
            outline: none;
        }

        button.action-btn {
            background: var(--primary);
            color: var(--white);
            border: 3px solid var(--dark);
            padding: 10px 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.1s;
        }

        button.action-btn:active {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        button.action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .info-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(41, 47, 54, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .popup-content {
            background: var(--white);
            padding: 30px;
            border-radius: 25px;
            border: 5px solid var(--dark);
            text-align: center;
            animation: popMark 0.5s;
            max-width: 90%;
        }

        .popup h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--primary);
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 0 var(--dark);
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes popMark {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseWin {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .welcome-title { font-size: 2.2rem; }
            .cell { font-size: 1rem; border-radius: 6px; }
            .bingo-grid { gap: 4px; padding: 4px; }
        }
    </style>
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div class="welcome-screen" id="welcomeScreen">
        <h1 class="welcome-title">🎮 BINGO DUEL</h1>
        <p class="welcome-subtitle">Cartoon Style Online Battle</p>
        
        <div class="menu-buttons">
            <button class="menu-btn primary" onclick="createRoom()">
                🟢 Create Room
            </button>
            <button class="menu-btn secondary" onclick="showSharePanel()">
                📤 Share Room ID
            </button>
            <button class="menu-btn" onclick="joinRoom()">
                🔗 Join Room
            </button>
        </div>

        <div class="room-panel" id="roomPanel">
            <p style="margin:0; font-weight:bold;">Room ID:</p>
            <div class="room-id-box" id="roomIdDisplay">------</div>
            <button class="menu-btn" style="padding:10px; font-size:1rem;" onclick="copyRoomId()">
                📋 Copy ID
            </button>
            <div class="copy-feedback" id="copyFeedback"></div>
            <button class="menu-btn primary" style="margin-top:10px;" onclick="startGameFromMenu()">
                ▶️ Start Game
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <span class="room-display-small">Room: <span id="gameRoomId">---</span></span>
            <div class="timer-box"><span class="timer-val" id="timer">60</span>s</div>
        </div>

        <div class="status-bar" style="margin-bottom:10px; font-weight:bold; color:var(--primary);" id="turnText">
            Your Turn
        </div>

        <!-- Warning Box -->
        <div class="warning-box" id="warningBox">
            ⚠️ You already used this number!
        </div>

        <!-- History of numbers YOU chose for opponent -->
        <div class="history-panel">
            <div class="history-title">📜 Numbers You Chose</div>
            <div class="history-list" id="historyList">
                <span style="color:#999; font-size:0.8rem;">None yet</span>
            </div>
        </div>

        <!-- 5x5 Grid -->
        <div class="bingo-grid" id="grid">
            <!-- Cells generated by JS -->
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="number" id="numberInput" min="1" max="25" placeholder="#">
                <button class="action-btn" id="submitBtn" onclick="submitNumber()">Send</button>
            </div>
            <button class="action-btn" id="restartBtn" onclick="initGame()" style="background:var(--secondary); display:none;">
                🔄 New Game
            </button>
        </div>

        <p class="info-text">
            <strong>Rule:</strong> Pick 1-25 for <strong>Opponent</strong>.<br>
            ⚠️ Each number can only be used ONCE!<br>
            Get 5 in a row to win!
        </p>
    </div>

    <!-- WIN POPUP -->
    <div class="popup" id="winPopup">
        <div class="popup-content">
            <h2 id="popupTitle">BINGO!</h2>
            <p id="popupMsg">You Won!</p>
            <button class="action-btn" onclick="initGame()">🔄 Play Again</button>
            <button class="action-btn" onclick="backToMenu()" style="background:var(--secondary); margin-left:10px;">
                🏠 Menu
            </button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let myBoard = [];       // My 5x5 numbers
        let myMarks = [];       // My marks (updated when opponent picks)
        let myHistory = [];     // Numbers I picked for opponent (cannot be reused)
        let timer = 60;
        let timerInterval;
        let isMyTurn = true;
        let gameActive = false;
        let roomId = '';

        // --- DOM ELEMENTS ---
        const welcomeScreen = document.getElementById('welcomeScreen');
        const gameContainer = document.getElementById('gameContainer');
        const roomPanel = document.getElementById('roomPanel');
        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const gameRoomId = document.getElementById('gameRoomId');
        const gridEl = document.getElementById('grid');
        const timerEl = document.getElementById('timer');
        const turnText = document.getElementById('turnText');
        const numberInput = document.getElementById('numberInput');
        const historyList = document.getElementById('historyList');
        const popup = document.getElementById('winPopup');
        const copyFeedback = document.getElementById('copyFeedback');
        const warningBox = document.getElementById('warningBox');

        // --- MENU FUNCTIONS ---
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function createRoom() {
            roomId = generateRoomId();
            roomIdDisplay.innerText = roomId;
            roomPanel.style.display = 'block';
        }

        function showSharePanel() {
            if (!roomId) roomId = generateRoomId();
            roomIdDisplay.innerText = roomId;
            roomPanel.style.display = 'block';
        }

        function joinRoom() {
            const input = prompt("Enter Room ID:");
            if (input) {
                roomId = input.toUpperCase();
                roomIdDisplay.innerText = roomId;
                roomPanel.style.display = 'block';
            }
        }

        function copyRoomId() {
            navigator.clipboard.writeText(roomId).then(() => {
                copyFeedback.innerText = "Copied to Clipboard!";
                setTimeout(() => copyFeedback.innerText = "", 2000);
            });
        }

        function startGameFromMenu() {
            roomPanel.style.display = 'none';
            welcomeScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            gameRoomId.innerText = roomId;
            initGame();
        }

        function backToMenu() {
            popup.style.display = 'none';
            gameContainer.style.display = 'none';
            welcomeScreen.style.display = 'flex';
            gameActive = false;
            clearInterval(timerInterval);
        }

        // --- GAME LOGIC ---
        function initGame() {
            // Reset State
            myBoard = generateUniqueNumbers(25);
            myMarks = new Array(25).fill(false);
            myHistory = [];  // Reset history
            timer = 60;
            isMyTurn = true;
            gameActive = true;

            // Reset UI
            popup.style.display = 'none';
            warningBox.classList.remove('show');
            numberInput.value = '';
            numberInput.disabled = false;
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
            document.querySelector('.input-group').style.display = 'flex';

            renderGrid();
            updateHistory();
            startTimer();
            updateStatus();
        }

        function generateUniqueNumbers(count) {
            let nums = Array.from({length: count}, (_, i) => i + 1);
            for (let i = nums.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            return nums;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            myBoard.forEach((num, index) => {
                const cell = document.createElement('div');
                cell.className = `cell ${myMarks[index] ? 'marked' : ''}`;
                cell.innerText = num;
                gridEl.appendChild(cell);
            });
        }

        function updateHistory() {
            if (myHistory.length === 0) {
                historyList.innerHTML = '<span style="color:#999; font-size:0.8rem;">None yet</span>';
                return;
            }
            historyList.innerHTML = '';
            myHistory.forEach(num => {
                const span = document.createElement('span');
                span.className = 'history-item';
                span.innerText = num;
                historyList.appendChild(span);
            });
        }

        function showWarning() {
            warningBox.classList.add('show');
            setTimeout(() => {
                warningBox.classList.remove('show');
            }, 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerEl.innerText = timer;
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timer--;
                timerEl.innerText = timer;
                if (timer <= 0) {
                    autoPick();
                }
            }, 1000);
        }

        function updateStatus() {
            if (isMyTurn) {
                turnText.innerText = "Your Turn (Pick for Opponent)";
                turnText.style.color = "var(--primary)";
                numberInput.disabled = false;
                document.getElementById('submitBtn').disabled = false;
                numberInput.focus();
            } else {
                turnText.innerText = "Opponent's Turn";
                turnText.style.color = "#ccc";
                numberInput.disabled = true;
                document.getElementById('submitBtn').disabled = true;
            }
        }

        // --- PLAYER ACTION ---
        function submitNumber() {
            if (!isMyTurn || !gameActive) return;

            let val = parseInt(numberInput.value);
            if (isNaN(val) || val < 1 || val > 25) {
                alert("Please choose a number between 1 and 25");
                return;
            }

            // ⚠️ Check if number already exists in history
            if (myHistory.includes(val)) {
                // Show warning and DO NOT send
                showWarning();
                numberInput.value = '';
                numberInput.focus();
                return;
            }

            // Add new number to history (permanent, cannot be reused)
            myHistory.push(val);
            updateHistory();

            console.log(`You sent ${val} to Opponent`);

            endTurn();
        }

        function autoPick() {
            let randomNum;
            // Find a number that hasn't been used yet
            do {
                randomNum = Math.floor(Math.random() * 25) + 1;
            } while (myHistory.includes(randomNum));
            
            myHistory.push(randomNum);
            updateHistory();
            console.log(`Time out! Auto sent ${randomNum}`);
            endTurn();
        }

        function endTurn() {
            numberInput.value = '';
            isMyTurn = false;
            updateStatus();

            // SIMULATE OPPONENT TURN (For Local Testing)
            setTimeout(() => {
                if (!gameActive) return;
                simulateOpponentMove();
            }, 2000);
        }

        function simulateOpponentMove() {
            if (!gameActive) return;

            // Opponent picks a number for ME
            let oppPick = Math.floor(Math.random() * 25) + 1;
            console.log(`Opponent sent ${oppPick} to You`);

            // Check if I have this number
            const index = myBoard.indexOf(oppPick);
            if (index !== -1) {
                // Mark it on my board (permanent mark)
                myMarks[index] = true;
                const cell = gridEl.children[index];
                cell.classList.add('marked');

                // Check Win
                if (checkWin()) {
                    endGame(true);
                    return;
                }
            }

            // Switch back to me
            isMyTurn = true;
            timer = 60;
            startTimer();
            updateStatus();
        }

        // --- WIN CHECK (5x5) ---
        function checkWin() {
            const size = 5;
            const checkLine = (indices) => indices.every(i => myMarks[i]);

            // Rows
            for (let r = 0; r < size; r++) {
                let rowIndices = [];
                for (let c = 0; c < size; c++) rowIndices.push(r * size + c);
                if (checkLine(rowIndices)) return true;
            }
            // Cols
            for (let c = 0; c < size; c++) {
                let colIndices = [];
                for (let r = 0; r < size; r++) colIndices.push(r * size + c);
                if (checkLine(colIndices)) return true;
            }
            // Diagonals
            if (checkLine([0, 6, 12, 18, 24])) return true;
            if (checkLine([4, 8, 12, 16, 20])) return true;

            return false;
        }

        function endGame(iWon) {
            gameActive = false;
            clearInterval(timerInterval);
            
            popup.style.display = 'flex';
            document.getElementById('popupTitle').innerText = iWon ? "🎉 BINGO!" : "BINGO!";
            document.getElementById('popupMsg').innerText = iWon ? "You Won the Match!" : "Opponent Won!";
            
            // Highlight winning cells
            const cells = document.querySelectorAll('.cell.marked');
            cells.forEach(c => c.classList.add('winning-cell'));

            document.querySelector('.input-group').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'inline-block';
        }

        // Enter key support
        numberInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") submitNumber();
        });

    </script>
</body>
</html>
